name: Deploy to AWS Elastic Beanstalk

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout the code
      - name: Checkout Code
        uses: actions/checkout@v3

      # Step 2: Set up JDK
      - name: Set Up JDK
        uses: actions/setup-java@v3
        with:
          distribution: 'corretto'
          java-version: '17'

      # Step 3: Build with Maven
      - name: Build with Maven
        run: mvn clean package -DskipTests

      - name: Set up AWS CLI
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Prepare deployment package
        run: |
          jar_file=$(ls target/*.jar | head -n 1)
          echo "Found JAR file: $jar_file"

          # Copy JAR to root as application.jar
          cp "$jar_file" application.jar

          # Zip ONLY application.jar
          zip -j deploy.zip application.jar

          echo "Created deploy.zip with contents:"
          unzip -l deploy.zip

      - name: Deploy to Elastic Beanstalk
        run: |
          VERSION="build-${{ github.run_id }}"
          echo "Using version label: $VERSION"

          # Upload ZIP to S3
          aws s3 cp deploy.zip s3://s3-datalogging-api/$VERSION.zip

          # Create EB application version
          aws elasticbeanstalk create-application-version \
            --application-name datalogging-api \
            --version-label "$VERSION" \
            --source-bundle S3Bucket="s3-datalogging-api",S3Key="$VERSION.zip"

          # Deploy that version
          aws elasticbeanstalk update-environment \
            --application-name datalogging-api \
            --environment-name Datalogging-api-env \
            --version-label "$VERSION"
