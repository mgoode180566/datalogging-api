name: Deploy to AWS Elastic Beanstalk


on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout the code
      - name: Checkout Code
        uses: actions/checkout@v3

      # Step 2: Set up JDK
      - name: Set Up JDK
        uses: actions/setup-java@v3
        with:
          distribution: 'corretto'
          java-version: '17'

      # Step 3: Build with Maven
      - name: Build with Maven
        run: mvn clean package -DskipTests

      # Step 4: Configure AWS CLI
      - name: Set up AWS CLI
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      # Step 5: Prepare ZIP package for Elastic Beanstalk
      - name: Prepare deployment package
        run: |
          echo "Preparing deployment package..."

          jar_file=$(ls target/*SNAPSHOT.jar | head -n 1)
          echo "Found JAR file: $jar_file"

          # Create deploy directory
          mkdir deploy

          # Copy JAR
          cp "$jar_file" deploy/application.jar

          # Copy Procfile if exists
          if [ -f "Procfile" ]; then
            cp Procfile deploy/Procfile
          fi

          # Copy .platform folder (important!)
          if [ -d ".platform" ]; then
            cp -r .platform deploy/.platform
          else
            echo "WARNING: .platform folder not found!"
          fi

          # Create ZIP file
          cd deploy
          zip -r ../deploy.zip .

          echo "Deployment ZIP created:"
          unzip -l ../deploy.zip

      # Step 6: Deploy to Elastic Beanstalk
      - name: Deploy to Elastic Beanstalk
        run: |
          VERSION="build-${{ github.run_id }}"
          echo "Using version label: $VERSION"

          # Upload ZIP to S3
          aws s3 cp deploy.zip s3://s3-datalogging-api/$VERSION.zip

          # Create EB application version
          aws elasticbeanstalk create-application-version \
            --application-name datalogging-api \
            --version-label "$VERSION" \
            --source-bundle S3Bucket="s3-datalogging-api",S3Key="$VERSION.zip"


          # Deploy version to environment
          aws elasticbeanstalk update-environment \
            --application-name datalogging-api \
            --environment-name Datalogging-api-env-1 \
            --version-label "$VERSION"
